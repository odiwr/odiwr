</g>
<text class="title" x="120" y="256" font-size="16" font-weight="600" text-anchor="middle">Broken Hearts</text>
<text class="artists" x="120" y="279" font-size="13" text-anchor="middle">Skepta, Central Cee, Jorja Smith</text>
</svg>
