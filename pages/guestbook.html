<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Guestbook — odiwr.com</title>
  <meta name="description" content="Sign Bill Odiwuor's guestbook. Leave your mark anywhere on the canvas." />
  <meta name="robots" content="noindex" />
  <link rel="canonical" href="https://odiwr.com/pages/guestbook.html" />
  <link rel="icon" type="image/x-icon" href="/assets/icons/favicon.ico" />
  <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=VT323&family=Orbitron:wght@700;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/reset.css" />
  <style>
    :root {
      --black:  #0a0a0a;
      --white:  #f0ece0;
      --green:  #00e620;
      --yellow: #ffe600;
      --red:    #ff1a00;
      --blue:   #0038ff;
      --pink:   #ff2d9b;
      --font-mono: 'Share Tech Mono', monospace;
      --font-vt:   'VT323', monospace;
      --font-orb:  'Orbitron', sans-serif;
    }

    html, body {
      height: 100%;
      background: var(--black);
      color: var(--white);
      font-family: var(--font-mono);
      overflow: hidden;
      user-select: none;
    }

    /* ── TOP BAR ── */
    .topbar {
      position: fixed;
      top: 0; left: 0; right: 0;
      z-index: 100;
      background: var(--black);
      border-bottom: 1px solid #222;
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 8px 16px;
      height: 44px;
    }

    .topbar-logo {
      font-family: var(--font-orb);
      font-size: 13px;
      font-weight: 900;
      letter-spacing: 3px;
      color: var(--white);
    }

    .topbar-title {
      font-family: var(--font-vt);
      font-size: 18px;
      color: var(--green);
      letter-spacing: 2px;
    }

    .topbar-hint {
      font-size: 11px;
      color: rgba(255,255,255,0.3);
      letter-spacing: 1px;
      margin-left: auto;
    }

    .back-link {
      font-family: var(--font-mono);
      font-size: 11px;
      color: rgba(255,255,255,0.4);
      letter-spacing: 1px;
      transition: color 0.15s;
    }

    .back-link:hover { color: var(--white); }

    /* ── CANVAS WORLD ── */
    #canvas-world {
      position: fixed;
      top: 44px; left: 0; right: 0; bottom: 0;
      overflow: hidden;
      cursor: crosshair;
      background: var(--black);
    }

    /* Dot grid background */
    #canvas-world::before {
      content: '';
      position: absolute;
      inset: 0;
      background-image: radial-gradient(circle, rgba(255,255,255,0.06) 1px, transparent 1px);
      background-size: 32px 32px;
      pointer-events: none;
      z-index: 0;
    }

    /* The infinite scrollable world */
    #world-inner {
      position: absolute;
      width: 6000px;
      height: 4000px;
      top: 0; left: 0;
      z-index: 1;
    }

    /* Each signature entry */
    .sig-entry {
      position: absolute;
      font-family: var(--font-mono);
      font-size: 14px;
      color: var(--white);
      white-space: pre;
      line-height: 1.4;
      pointer-events: none;
      word-break: break-all;
      max-width: 400px;
    }

    /* ── TYPE CURSOR ── */
    #type-cursor {
      position: absolute;
      display: none;
      z-index: 50;
      pointer-events: none;
    }

    #type-cursor::after {
      content: '█';
      font-family: var(--font-mono);
      font-size: 14px;
      color: var(--green);
      animation: blink 0.8s step-end infinite;
    }

    /* ── ACTIVE TEXT INPUT ── */
    #active-text {
      position: absolute;
      font-family: var(--font-mono);
      font-size: 14px;
      color: var(--green);
      white-space: pre;
      line-height: 1.4;
      z-index: 50;
      pointer-events: none;
      display: none;
    }

    /* ── SUBMIT PANEL ── */
    #submit-panel {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 200;
      background: rgba(10,10,10,0.95);
      border: 1px solid rgba(255,255,255,0.15);
      padding: 14px 20px;
      display: none;
      gap: 10px;
      align-items: center;
      flex-wrap: wrap;
      justify-content: center;
      min-width: 320px;
    }

    #submit-panel.active {
      display: flex;
    }

    .submit-hint {
      font-size: 11px;
      color: rgba(255,255,255,0.4);
      letter-spacing: 1px;
      width: 100%;
      text-align: center;
    }

    .btn {
      font-family: var(--font-orb);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 2px;
      padding: 8px 16px;
      cursor: pointer;
      border: 1px solid;
      transition: all 0.15s;
    }

    .btn-submit {
      color: var(--green);
      border-color: var(--green);
      background: transparent;
    }

    .btn-submit:hover {
      background: var(--green);
      color: var(--black);
    }

    .btn-cancel {
      color: rgba(255,255,255,0.4);
      border-color: rgba(255,255,255,0.2);
      background: transparent;
    }

    .btn-cancel:hover {
      color: var(--white);
      border-color: var(--white);
    }

    /* ── TOAST ── */
    #toast {
      position: fixed;
      top: 60px;
      left: 50%;
      transform: translateX(-50%) translateY(-10px);
      background: var(--green);
      color: var(--black);
      font-family: var(--font-mono);
      font-size: 13px;
      letter-spacing: 1px;
      padding: 10px 20px;
      z-index: 300;
      opacity: 0;
      transition: all 0.3s;
      pointer-events: none;
    }

    #toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    #toast.error {
      background: var(--red);
      color: var(--white);
    }

    /* ── SCANLINES ── */
    .scanlines {
      position: fixed;
      inset: 0;
      z-index: 999;
      pointer-events: none;
      background: repeating-linear-gradient(
        to bottom,
        transparent,
        transparent 2px,
        rgba(0,0,0,0.06) 2px,
        rgba(0,0,0,0.06) 4px
      );
    }

    /* ── LOADING ── */
    #loading {
      position: fixed;
      inset: 44px 0 0;
      z-index: 500;
      background: var(--black);
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: var(--font-vt);
      font-size: 22px;
      color: rgba(255,255,255,0.3);
      letter-spacing: 3px;
    }

    @keyframes blink {
      0%, 49% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }
  </style>
</head>
<body>

  <div class="scanlines" aria-hidden="true"></div>

  <!-- TOP BAR -->
  <div class="topbar">
    <span class="topbar-logo">ODIWR</span>
    <span class="topbar-title">// GUESTBOOK</span>
    <span class="topbar-hint">CLICK ANYWHERE TO TYPE · DRAG TO SCROLL</span>
    <a href="/" class="back-link">← BACK</a>
  </div>

  <!-- TOAST -->
  <div id="toast" role="status" aria-live="polite"></div>

  <!-- LOADING -->
  <div id="loading">LOADING SIGNATURES...</div>

  <!-- CANVAS WORLD -->
  <div id="canvas-world">
    <div id="world-inner">
      <div id="type-cursor"></div>
      <div id="active-text"></div>
      <!-- Signatures are injected here by JS -->
    </div>
  </div>

  <!-- SUBMIT PANEL -->
  <div id="submit-panel" role="dialog" aria-label="Submit signature">
    <span class="submit-hint">PRESS ENTER TO CONFIRM · ESC TO CANCEL</span>
    <button class="btn btn-submit" id="btn-submit">SIGN IT</button>
    <button class="btn btn-cancel" id="btn-cancel">CANCEL</button>
  </div>

  <script>
  // ═══════════════════════════════════════════
  // CONFIGURATION — fill in your Supabase details
  // after creating a free project at supabase.com
  // ═══════════════════════════════════════════
  const SUPABASE_URL = 'YOUR_SUPABASE_URL';      // e.g. https://xxxx.supabase.co
  const SUPABASE_ANON_KEY = 'YOUR_SUPABASE_ANON_KEY';
  const TABLE = 'guestbook';
  const NOTIFY_EMAIL = 'hello@odiwr.com';         // for flagged entries

  // ═══════════════════════════════════════════
  // FILTER CONFIG
  // ═══════════════════════════════════════════
  const SLUR_LIST = [
    // Basic placeholder — replace/expand with your actual list
    'slur1', 'slur2'
  ];

  const ASCII_ART_THRESHOLD = 80; // characters; longer = likely ASCII art

  function needsReview(text) {
    const lower = text.toLowerCase();
    // Check for slurs
    if (SLUR_LIST.some(s => lower.includes(s))) return true;
    // Check for multi-line or very long (ASCII art)
    if (text.includes('\n') && text.length > ASCII_ART_THRESHOLD) return true;
    // Check for dense symbol usage (ASCII art indicators)
    const symbolDensity = (text.match(/[░▒▓█▀▄■□▪▫|\/\\─┼╔╗╚╝]/g) || []).length / text.length;
    if (symbolDensity > 0.15) return true;
    return false;
  }

  // ═══════════════════════════════════════════
  // STATE
  // ═══════════════════════════════════════════
  const worldEl   = document.getElementById('world-inner');
  const cursor    = document.getElementById('type-cursor');
  const activeText= document.getElementById('active-text');
  const submitPanel = document.getElementById('submit-panel');
  const toast     = document.getElementById('toast');
  const loading   = document.getElementById('loading');
  const canvasWorld = document.getElementById('canvas-world');

  let isTyping    = false;
  let currentText = '';
  let typePosX    = 0;
  let typePosY    = 0;
  // Pan state
  let isPanning   = false;
  let panStartX   = 0;
  let panStartY   = 0;
  let scrollX     = 0;
  let scrollY     = 0;
  // Offset: world starts centered
  let offsetX     = 0;
  let offsetY     = 0;

  // Initialize world offset to center of world
  offsetX = -(6000 / 2 - window.innerWidth / 2);
  offsetY = -(4000 / 2 - (window.innerHeight - 44) / 2);
  worldEl.style.transform = `translate(${offsetX}px, ${offsetY}px)`;

  // ═══════════════════════════════════════════
  // SUPABASE API HELPERS
  // ═══════════════════════════════════════════
  async function supabaseFetch(method, path, body) {
    const res = await fetch(`${SUPABASE_URL}/rest/v1/${path}`, {
      method,
      headers: {
        'apikey': SUPABASE_ANON_KEY,
        'Authorization': `Bearer ${SUPABASE_ANON_KEY}`,
        'Content-Type': 'application/json',
        'Prefer': 'return=representation',
      },
      body: body ? JSON.stringify(body) : undefined,
    });
    if (!res.ok) throw new Error(await res.text());
    if (res.status === 204) return null;
    return res.json();
  }

  async function loadSignatures() {
    try {
      const data = await supabaseFetch('GET', `${TABLE}?approved=eq.true&order=created_at.asc&limit=500`);
      loading.style.display = 'none';
      if (data) data.forEach(renderSig);
    } catch (e) {
      loading.textContent = 'COULD NOT LOAD SIGNATURES';
      console.error(e);
    }
  }

  async function submitSignature(text, x, y) {
    const flagged = needsReview(text);
    const entry = {
      content: text,
      x: Math.round(x),
      y: Math.round(y),
      approved: !flagged,
      flagged,
      created_at: new Date().toISOString(),
    };
    try {
      const data = await supabaseFetch('POST', TABLE, entry);
      if (!flagged && data && data[0]) {
        renderSig(data[0]);
        showToast('SIGNED ✓');
      } else if (flagged) {
        showToast('SENT FOR REVIEW', false);
      }
    } catch (e) {
      showToast('ERROR — TRY AGAIN', true);
      console.error(e);
    }
  }

  // ═══════════════════════════════════════════
  // RENDER
  // ═══════════════════════════════════════════
  function renderSig(entry) {
    const el = document.createElement('div');
    el.className = 'sig-entry';
    el.style.left = entry.x + 'px';
    el.style.top  = entry.y + 'px';
    el.textContent = entry.content;
    worldEl.appendChild(el);
  }

  // ═══════════════════════════════════════════
  // TYPING
  // ═══════════════════════════════════════════
  function startTyping(worldX, worldY) {
    if (isTyping) commitTyping();
    isTyping = true;
    currentText = '';
    typePosX = worldX;
    typePosY = worldY;

    activeText.style.left   = worldX + 'px';
    activeText.style.top    = worldY + 'px';
    activeText.style.display = 'block';
    activeText.textContent  = '';

    cursor.style.left   = worldX + 'px';
    cursor.style.top    = worldY + 'px';
    cursor.style.display = 'block';

    submitPanel.classList.add('active');
  }

  function updateActiveText() {
    activeText.textContent = currentText;
    // Move cursor to end of last line
    const lines = currentText.split('\n');
    const lastLine = lines[lines.length - 1];
    const lineHeight = 20;
    const charWidth = 8.4;
    cursor.style.left = (typePosX + lastLine.length * charWidth) + 'px';
    cursor.style.top  = (typePosY + (lines.length - 1) * lineHeight) + 'px';
  }

  function cancelTyping() {
    isTyping = false;
    currentText = '';
    activeText.style.display = 'none';
    cursor.style.display = 'none';
    submitPanel.classList.remove('active');
  }

  async function commitTyping() {
    if (!isTyping || !currentText.trim()) {
      cancelTyping();
      return;
    }
    const text = currentText.trim();
    cancelTyping();
    await submitSignature(text, typePosX, typePosY);
  }

  // ═══════════════════════════════════════════
  // PANNING
  // ═══════════════════════════════════════════
  canvasWorld.addEventListener('mousedown', e => {
    if (e.target.closest('#submit-panel')) return;
    // Middle click or holding space = pan
    if (e.button === 1 || e.button === 2) {
      isPanning = true;
      panStartX = e.clientX - offsetX;
      panStartY = e.clientY - offsetY;
      canvasWorld.style.cursor = 'grabbing';
      e.preventDefault();
      return;
    }
    // Left click = start typing or pan (drag)
    panStartX = e.clientX - offsetX;
    panStartY = e.clientY - offsetY;
    isPanning = false;
    scrollX = e.clientX;
    scrollY = e.clientY;
  });

  canvasWorld.addEventListener('mousemove', e => {
    if (isPanning) {
      offsetX = e.clientX - panStartX;
      offsetY = e.clientY - panStartY;
      clampOffset();
      worldEl.style.transform = `translate(${offsetX}px, ${offsetY}px)`;
    }
  });

  canvasWorld.addEventListener('mouseup', e => {
    if (e.button === 1 || e.button === 2) {
      isPanning = false;
      canvasWorld.style.cursor = 'crosshair';
      return;
    }
    if (isPanning) {
      isPanning = false;
      canvasWorld.style.cursor = 'crosshair';
      return;
    }

    // Check if this was a drag (panning)
    const dist = Math.hypot(e.clientX - scrollX, e.clientY - scrollY);
    if (dist > 5) {
      // It was a drag — pan instead of type
      offsetX = e.clientX - panStartX;
      offsetY = e.clientY - panStartY;
      clampOffset();
      worldEl.style.transform = `translate(${offsetX}px, ${offsetY}px)`;
      return;
    }

    // It was a click — start typing
    const worldX = e.clientX - offsetX;
    const worldY = (e.clientY - 44) - offsetY;
    startTyping(worldX, worldY);
  });

  // Right-click to pan
  canvasWorld.addEventListener('contextmenu', e => e.preventDefault());

  // Touch pan
  let touchStartX = 0, touchStartY = 0;
  canvasWorld.addEventListener('touchstart', e => {
    touchStartX = e.touches[0].clientX - offsetX;
    touchStartY = e.touches[0].clientY - offsetY;
  }, { passive: true });

  canvasWorld.addEventListener('touchmove', e => {
    offsetX = e.touches[0].clientX - touchStartX;
    offsetY = e.touches[0].clientY - touchStartY;
    clampOffset();
    worldEl.style.transform = `translate(${offsetX}px, ${offsetY}px)`;
  }, { passive: true });

  function clampOffset() {
    const maxX = 200;
    const minX = -(6000 - window.innerWidth) - 200;
    const maxY = 200;
    const minY = -(4000 - (window.innerHeight - 44)) - 200;
    offsetX = Math.max(minX, Math.min(maxX, offsetX));
    offsetY = Math.max(minY, Math.min(maxY, offsetY));
  }

  // ═══════════════════════════════════════════
  // KEYBOARD
  // ═══════════════════════════════════════════
  document.addEventListener('keydown', e => {
    if (!isTyping) return;

    if (e.key === 'Escape') {
      cancelTyping();
      return;
    }

    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      commitTyping();
      return;
    }

    if (e.key === 'Enter' && e.shiftKey) {
      currentText += '\n';
      updateActiveText();
      return;
    }

    if (e.key === 'Backspace') {
      e.preventDefault();
      currentText = currentText.slice(0, -1);
      updateActiveText();
      return;
    }

    // Allow printable characters
    if (e.key.length === 1 && !e.ctrlKey && !e.metaKey) {
      if (currentText.length < 500) {
        currentText += e.key;
        updateActiveText();
      }
    }
  });

  // ═══════════════════════════════════════════
  // SUBMIT PANEL BUTTONS
  // ═══════════════════════════════════════════
  document.getElementById('btn-submit').addEventListener('click', commitTyping);
  document.getElementById('btn-cancel').addEventListener('click', cancelTyping);

  // ═══════════════════════════════════════════
  // TOAST
  // ═══════════════════════════════════════════
  function showToast(msg, isError = false) {
    toast.textContent = msg;
    toast.classList.remove('error');
    if (isError) toast.classList.add('error');
    toast.classList.add('show');
    setTimeout(() => toast.classList.remove('show'), 3000);
  }

  // ═══════════════════════════════════════════
  // INIT
  // ═══════════════════════════════════════════
  loadSignatures();

  </script>
</body>
</html>
